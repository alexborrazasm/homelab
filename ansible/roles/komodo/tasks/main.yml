---
- name: Ensure /srv/docker/komodo exists
  ansible.builtin.file:
    path: /srv/docker/komodo
    state: directory
    owner: docker
    group: docker
    mode: "0755"

- name: Ensure the data directories exist
  # Bind mounts next to compose.yaml, not named volumes - plain
  # directories are easy to later re-point at an NFS mount, unlike named
  # volumes living under Docker's own /var/lib/docker/volumes.
  ansible.builtin.file:
    path: "/srv/docker/komodo/data/{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
  loop:
    - backups

- name: Ensure mongo's data directories (and contents) are owned by docker
  # recurse: true - mongo wrote its data as its own internal uid (999)
  # before this role pinned it to 900:900. Without recursing, only the
  # directories themselves get fixed, not the files already inside.
  ansible.builtin.file:
    path: "/srv/docker/komodo/data/{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: "0755"
    recurse: true
  loop:
    - mongo-data
    - mongo-config

- name: Ensure the keys data directory (and its contents) are owned by docker
  # recurse: true - Periphery/Core generate key files here as root before
  # this role pinned them to 900:900. Without recursing, only the
  # directory itself gets fixed, not files already inside it.
  ansible.builtin.file:
    path: /srv/docker/komodo/data/keys
    state: directory
    owner: docker
    group: docker
    mode: "0755"
    recurse: true

- name: Ensure /srv/docker/komodo-repos exists (Periphery's root_directory)
  # Periphery runs as 900:900 (not root) - it needs to already own this
  # before it starts, or git clones under it fail with "dubious
  # ownership" (owner mismatch) instead of just working.
  ansible.builtin.file:
    path: /srv/docker/komodo-repos
    state: directory
    owner: docker
    group: docker
    mode: "0755"

- name: Deploy the Komodo compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: /srv/docker/komodo/compose.yaml
    owner: docker
    group: docker
    mode: "0644"
  register: _komodo_compose

- name: Deploy the Komodo environment file
  ansible.builtin.copy:
    src: .env
    dest: /srv/docker/komodo/.env
    owner: docker
    group: docker
    mode: "0600"
  register: _komodo_env

- name: Start Komodo (core, periphery, mongo)
  # Plain `sudo -u docker`, not Ansible's become_user - become_user tries
  # to ACL the temp dir with BSD/macOS chmod syntax ("chmod A+..."), which
  # fails on Linux. We're already root here (become: true at the play
  # level), so sudo -u needs no password.
  ansible.builtin.command: sudo -u docker -H docker compose -p komodo up -d
  args:
    chdir: /srv/docker/komodo
  changed_when: true

- name: Wait for Core to generate its keypair
  ansible.builtin.wait_for:
    path: /srv/docker/komodo/data/keys/core.pub
    timeout: 30

- name: Read Core's public key
  # Exposed via hostvars to the komodo_agent role (same playbook run) -
  # so a rebuilt Core's new key reaches every agent automatically instead
  # of a stale copy committed to git.
  ansible.builtin.slurp:
    src: /srv/docker/komodo/data/keys/core.pub
  register: _komodo_core_pub_raw

- name: Expose Core's public key as a fact
  ansible.builtin.set_fact:
    komodo_core_public_key: "{{ _komodo_core_pub_raw.content | b64decode }}"
