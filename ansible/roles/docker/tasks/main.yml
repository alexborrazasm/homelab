---
# RedHat-family only for now - every docker host is an AlmaLinux VM. Add a
# Debian branch (like common_tools does) if a Debian docker host shows up.
- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "ansible/roles/docker only supports RedHat-family hosts right now"
  when: ansible_facts['os_family'] != "RedHat"

- name: Create the docker group with a fixed GID
  # Pinned so it's identical across every docker host - matters once
  # anything shares volumes/NFS between them. Created before the package
  # install below, which reuses an existing "docker" group instead of
  # letting the postinst script pick whatever GID is next free.
  ansible.builtin.group:
    name: docker
    gid: 900
    system: true

- name: Install dnf-plugins-core (needed for config-manager)
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present

- name: Add the Docker CE repository
  ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
  args:
    creates: /etc/yum.repos.d/docker-ce.repo

- name: Install Docker
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Check whether the netfilter addrtype module is present
  # AlmaLinux's cloud image is missing kernel-modules-extra - Docker's
  # bridge networking needs xt_addrtype for its iptables NAT rules.
  ansible.builtin.command: modprobe xt_addrtype
  register: _xt_addrtype_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install kernel-modules-extra for the running kernel
  ansible.builtin.dnf:
    name: "kernel-modules-extra-{{ ansible_facts['kernel'] }}"
    state: present
  when: _xt_addrtype_check.rc != 0
  register: _kmod_extra_installed

- name: Load xt_addrtype now (don't wait for a reboot)
  ansible.builtin.command: modprobe xt_addrtype
  when: _kmod_extra_installed is changed
  changed_when: true

- name: Load xt_addrtype on every future boot too
  ansible.builtin.copy:
    dest: /etc/modules-load.d/docker-netfilter.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      xt_addrtype

- name: Ensure the docker.service systemd drop-in directory exists
  # On a cold boot, docker.service can start right after firewalld.service
  # reports active but before firewalld has actually finished setting up
  # its nftables tables - dockerd then fails to append its NAT rule
  # ("RULE_APPEND failed (No such file or directory)"). Restart=always is
  # already set upstream, but the default 3-tries/60s budget can run out
  # before firewalld settles, leaving docker.service "failed" until
  # someone starts it by hand. More retries with a short delay between
  # them ride out the race instead.
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give Docker more restart budget against the firewalld boot race
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/firewalld-race.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      StartLimitIntervalSec=120
      StartLimitBurst=10

      [Service]
      RestartSec=5
  register: _docker_systemd_override

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true
  when: _docker_systemd_override is changed

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create the docker service user with a fixed UID
  # Same UID:GID (900:900) on every docker host, for the same reason as
  # the group above. Dedicated account that owns/runs every compose
  # stack, kept separate from the personal login user so file ownership
  # doesn't get muddled between people/processes. Reached via `sd` (the
  # alias below), not a direct SSH login of its own.
  ansible.builtin.user:
    name: docker
    uid: 900
    group: docker
    system: true
    shell: /bin/bash
    home: /srv/docker
    create_home: true

- name: Let the docker group traverse/read /srv/docker
  # Home dirs default to 0700 (owner-only) - loosen just enough for group
  # members (e.g. alex, added to the docker group below) to browse in,
  # without opening it to every user on the box.
  ansible.builtin.file:
    path: /srv/docker
    state: directory
    owner: docker
    group: docker
    mode: "0750"

- name: Deploy the sd (sudo su docker) shell alias
  ansible.builtin.copy:
    dest: /etc/profile.d/zz-docker-alias.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      alias sd='sudo su - docker'

- name: "Add {{ ansible_user }} to the docker group"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
