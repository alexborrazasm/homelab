---
# Intel iGPU SR-IOV vGPUs (Alder Lake UHD Graphics on the NUC 12 Pro) - xe
# is the only driver of the two that supports SR-IOV on this hardware, so
# i915 is force-disabled and xe force-enabled. VFs created here show up as
# extra PCI devices that can be passed through to VMs.

- name: Install GPU tooling
  # intel-gpu-tools' own intel_gpu_top is stuck on 2.0-1 in Debian trixie,
  # which predates xe driver support - it still uses the i915 PMU/perf
  # interface, so it fails ("Kernel 4.16 or newer is required for i915 PMU
  # support") on every VF even with an explicit device filter. Kept for
  # its other utilities (intel_reg, etc) anyway.
  ansible.builtin.apt:
    name: intel-gpu-tools
    state: present
    update_cache: true

- name: Remove nvtop
  # Once a VF is handed to a guest, the host has no visibility into its
  # usage anymore - nvtop here shows nothing useful. Confirmed live.
  ansible.builtin.apt:
    name: nvtop
    state: absent

- name: Force the xe driver instead of i915 (only xe supports SR-IOV here)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/intel-graphics.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      options i915 force_probe=!*
      options xe force_probe=*
  notify: "Update initramfs"

- name: Enable IOMMU/VT-d on the kernel command line
  # This platform's DMAR tables already enable IOMMU groups even without
  # this (confirmed live), but setting it explicitly makes the intent
  # durable instead of relying on that default surviving a firmware/kernel
  # change.
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on iommu=pt"'
  notify: "Update grub"

- name: Check existing PCI resource mappings
  ansible.builtin.command: pvesh get /cluster/mapping/pci --output-format json
  changed_when: false
  check_mode: false
  register: _pci_mappings

- name: Read each VF's IOMMU group
  # Just for bootstrapping brand-new mappings below - not a source of
  # truth. VF IOMMU group numbers aren't stable across reboots (confirmed
  # live: same VF, group 24 one boot, 17 the next - the kernel assigns
  # them dynamically as VFs are recreated), so whatever's read here at
  # Ansible-apply-time will usually be stale by the next reboot. The
  # actual fix-up-on-every-boot happens in the script below.
  ansible.builtin.shell: >
    set -o pipefail && basename "$(readlink /sys/bus/pci/devices/{{ proxmox_vgpu_pci_slot }}.{{ item }}/iommu_group)"
  args:
    executable: /bin/bash
  loop: "{{ range(1, proxmox_vgpu_num_vfs + 1) | list }}"
  changed_when: false
  register: _vgpu_iommu_groups

- name: Create a resource mapping for each VF that doesn't have one yet
  # Proxmox only lets root@pam set hostpci0 to a raw PCI ID - a Resource
  # Mapping is the one way to let the (non-root) Terraform token attach a
  # PCI device to a VM (see the "Mapping.Use" privilege on TerraformProv
  # in terraform_api.yml). One mapping per VF so any VM can reference one
  # by name in terraform/locals.tf's hostpci field.
  ansible.builtin.command: >
    pvesh create /cluster/mapping/pci
    --id intel-gpu-vf{{ item.item }}
    --map "node=pve,path={{ proxmox_vgpu_pci_slot }}.{{ item.item }},id={{ proxmox_vgpu_vf_pci_id }},subsystem-id={{ proxmox_vgpu_vf_subsystem_id }},iommugroup={{ item.stdout }}"
  loop: "{{ _vgpu_iommu_groups.results }}"
  when: "('intel-gpu-vf' ~ item.item) not in (_pci_mappings.stdout | from_json | map(attribute='id') | list)"

- name: Deploy the script that (re)creates the VFs and syncs their PCI mappings
  # sriov_numvfs under /sys is runtime-only and resets to 0 on every boot,
  # so the VFs have to be recreated at each boot, not just once by hand -
  # and since that also reassigns IOMMU group numbers (see above), the
  # mappings have to be re-synced to match every time too, not just
  # created once from Ansible.
  ansible.builtin.copy:
    dest: /usr/local/sbin/intel-gpu-sriov-setup.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail

      echo {{ proxmox_vgpu_num_vfs }} > /sys/bus/pci/devices/{{ proxmox_vgpu_pci_device }}/sriov_numvfs

      for i in $(seq 1 {{ proxmox_vgpu_num_vfs }}); do
        group=$(basename "$(readlink "/sys/bus/pci/devices/{{ proxmox_vgpu_pci_slot }}.${i}/iommu_group")")
        pvesh set "/cluster/mapping/pci/intel-gpu-vf${i}" \
          --map "node=pve,path={{ proxmox_vgpu_pci_slot }}.${i},id={{ proxmox_vgpu_vf_pci_id }},subsystem-id={{ proxmox_vgpu_vf_subsystem_id }},iommugroup=${group}"
      done
  register: _vgpu_setup_script

- name: Deploy the systemd unit that runs it on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/intel-gpu-sriov.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Enable Intel GPU SR-IOV virtual functions and sync their PCI mappings
      # pve-guests.service (autostarts VMs with onboot=1, e.g. iot) is
      # itself Before=multi-user.target - so an explicit After=multi-user.target
      # here (tried once, reverted) creates an ordering cycle with the
      # Before=pve-guests.service below, and systemd breaks the cycle by
      # deactivating this unit instead of running it. No After= is needed:
      # WantedBy=multi-user.target below already implies Before=multi-user.target
      # by default, which is what we want (run early, same as pve-guests).
      # Without this Before=, the two have no ordering relative to each
      # other and can race, so a VM needing a VF can lose that race and
      # fail to start ("PCI device mapping invalid ... not found") even
      # though the VF gets created a second later. Both failure modes
      # confirmed live after real pve reboots.
      Before=pve-guests.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/intel-gpu-sriov-setup.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  register: _vgpu_systemd_unit

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true
  when: _vgpu_systemd_unit is changed

- name: Enable and (re)start the SR-IOV VF service
  # Restart (not just start) when the script or unit changed, so a stale
  # mapping gets corrected immediately instead of waiting for the next
  # reboot.
  ansible.builtin.systemd:
    name: intel-gpu-sriov
    enabled: true
    state: "{{ 'restarted' if (_vgpu_setup_script is changed or _vgpu_systemd_unit is changed) else 'started' }}"
