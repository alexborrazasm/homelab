---
# Never auto-reload networking. A bad interfaces file applied over SSH can
# lock you out of the box. Review the --check --diff output first, then
# either run `ifreload -a` by hand or rerun with -e proxmox_net_apply_reload=true.
proxmox_net_apply_reload: false

proxmox_repo_manage: true
proxmox_nag_remove: true
proxmox_ha_disable: true
proxmox_shell_warning: true
proxmox_terraform_api: true

proxmox_vgpu_enable: true
# 0000:00:02.0 - the NUC's integrated Alder Lake GPU (lspci -k | grep -A3 VGA).
proxmox_vgpu_pci_device: "0000:00:02.0"
proxmox_vgpu_num_vfs: 2

proxmox_vm_template_create: true
proxmox_template_vmid: 9000
proxmox_template_name: "almalinux-10-cloudinit"
proxmox_template_image_url: "https://repo.almalinux.org/almalinux/10/cloud/x86_64_v2/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64_v2.qcow2"
proxmox_template_image_file: "AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64_v2.qcow2"
proxmox_template_image_sha256: "cd17bcbd7ac62a7f179c30fb24f5795c411d540650b4f060d2167859e2fd3d95"
