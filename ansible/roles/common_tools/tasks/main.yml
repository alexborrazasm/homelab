---
# ansible.builtin.package dispatches to apt/dnf/etc based on facts. On
# AlmaLinux, EPEL must already be enabled (see tasks/epel.yml).
- name: Enable EPEL where needed
  ansible.builtin.import_tasks: epel.yml

- name: Install common CLI tools
  ansible.builtin.package:
    name: "{{ common_tools_packages + (common_tools_packages_by_os_family[ansible_facts['os_family']] | default([])) }}"
    state: present
    update_cache: true

- name: Install eza (not packaged everywhere - e.g. missing from EPEL 10)
  ansible.builtin.package:
    name: eza
    state: present
  register: _eza_pkg
  ignore_errors: true

- name: Install eza from upstream release (only where no package is available)
  when: _eza_pkg is failed
  block:
    - name: Download the eza static binary
      ansible.builtin.get_url:
        url: "https://github.com/eza-community/eza/releases/download/v{{ common_tools_eza_version }}/eza_x86_64-unknown-linux-musl.tar.gz"
        dest: "/tmp/eza_{{ common_tools_eza_version }}.tar.gz"
        checksum: "sha256:{{ common_tools_eza_sha256 }}"
        mode: "0644"

    - name: Extract eza to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/eza_{{ common_tools_eza_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        owner: root
        group: root
        mode: "0755"

- name: Remove old un-prefixed profile.d filenames
  # Distro-shipped scripts like colorls.sh sort after a plain
  # "cli-defaults.sh" and clobber our aliases (e.g. ls) - renamed with a
  # zz- prefix below to guarantee we load last. Clean up the old names so
  # they don't linger as dead duplicates on already-provisioned hosts.
  ansible.builtin.file:
    path: "/etc/profile.d/{{ item }}"
    state: absent
  loop:
    - bash-color-prompt.sh
    - cli-defaults.sh

- name: Deploy the Fedora-style colored bash prompt
  ansible.builtin.copy:
    src: bash-color-prompt.sh
    dest: /etc/profile.d/zz-bash-color-prompt.sh
    owner: root
    group: root
    mode: "0644"
  when: common_tools_color_prompt | bool

- name: Create the system-wide Neovim config dir
  ansible.builtin.file:
    path: /etc/xdg/nvim
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the system-wide Neovim config
  # $XDG_CONFIG_DIRS/nvim/sysinit.vim (default /etc/xdg) - applies to every
  # user on the box, no per-user dotfiles needed. Confirmed against the
  # installed Neovim's own docs (:help sysinit.vim), same path on any distro.
  ansible.builtin.copy:
    dest: /etc/xdg/nvim/sysinit.vim
    owner: root
    group: root
    mode: "0644"
    content: |
      lua <<EOF
      -- Core
      vim.o.number = true
      vim.o.relativenumber = true
      vim.o.mouse = "a"
      vim.o.expandtab = true
      vim.o.shiftwidth = 2
      vim.o.tabstop = 2
      vim.o.termguicolors = true
      vim.g.mapleader = " "

      -- Clipboard over SSH: built-in OSC52 provider (Neovim 0.10+), no plugin needed.
      vim.o.clipboard = "unnamedplus"
      vim.g.clipboard = {
        name = "OSC 52",
        copy = {
          ["+"] = require("vim.ui.clipboard.osc52").copy("+"),
          ["*"] = require("vim.ui.clipboard.osc52").copy("*"),
        },
        paste = {
          ["+"] = require("vim.ui.clipboard.osc52").paste("+"),
          ["*"] = require("vim.ui.clipboard.osc52").paste("*"),
        },
      }

      -- Keymaps
      vim.keymap.set("n", "<leader>w", ":w<CR>")
      vim.keymap.set("n", "<leader>q", ":q<CR>")
      vim.keymap.set("v", "<leader>y", '"+y', { noremap = true })
      vim.keymap.set("n", "<leader>y", '"+y', { noremap = true })
      vim.keymap.set("n", "gy", '"+yy', { noremap = true })
      EOF

- name: Harden sshd
  ansible.builtin.import_tasks: ssh.yml

- name: Set up fail2ban
  ansible.builtin.import_tasks: fail2ban.yml

- name: Deploy system-wide shell defaults (editor, aliases)
  ansible.builtin.copy:
    dest: /etc/profile.d/zz-cli-defaults.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      export EDITOR=nvim
      export VISUAL=nvim
      alias vi=nvim
      alias vim=nvim

      # eza isn't packaged everywhere (e.g. EPEL 10) - fall back to plain ls.
      if command -v eza >/dev/null 2>&1; then
        alias l="eza --group-directories-first"
        alias ll="eza -lh --group --group-directories-first"
        alias la="eza -a --group-directories-first"
        alias lla="eza -lha --group --group-directories-first"
        alias ls="eza --group-directories-first"
      else
        alias l="ls --color=auto"
        alias ll="ls -lh --color=auto"
        alias la="ls -A --color=auto"
        alias lla="ls -lhA --color=auto"
        alias ls="ls --color=auto"
      fi

      # Debian packages bat's binary as "batcat" (name clash with another
      # package); AlmaLinux/EPEL ships it as "bat". Detect instead of
      # hardcoding one or the other.
      if command -v batcat >/dev/null 2>&1; then
        alias cat="batcat -pP"
      elif command -v bat >/dev/null 2>&1; then
        alias cat="bat -pP"
      fi
