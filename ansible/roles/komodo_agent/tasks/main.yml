---
- name: Ensure /srv/docker/komodo-agent exists
  ansible.builtin.file:
    path: /srv/docker/komodo-agent
    state: directory
    owner: docker
    group: docker
    mode: "0755"

- name: Ensure the keys data directory (and its contents) are owned by docker
  # recurse: true - Periphery generated its key files here as root before
  # this role pinned it to 900:900. Without recursing, only the directory
  # itself gets fixed, not files already inside it.
  ansible.builtin.file:
    path: /srv/docker/komodo-agent/data/keys
    state: directory
    owner: docker
    group: docker
    mode: "0755"
    recurse: true

- name: Ensure /srv/docker/komodo exists (Periphery's root_directory)
  # Periphery runs as 900:900 (not root) - it needs to already own this
  # before it starts, or git clones under it fail with "dubious
  # ownership" (owner mismatch) instead of just working.
  ansible.builtin.file:
    path: /srv/docker/komodo
    state: directory
    owner: docker
    group: docker
    mode: "0755"

- name: Deploy the Periphery compose file
  ansible.builtin.copy:
    src: compose.yaml
    dest: /srv/docker/komodo-agent/compose.yaml
    owner: docker
    group: docker
    mode: "0644"

- name: Deploy the Periphery environment file
  ansible.builtin.template:
    src: .env.j2
    dest: /srv/docker/komodo-agent/.env
    owner: docker
    group: docker
    mode: "0644"

- name: Trust Core's public key
  # Read via hostvars from the komodo role (same playbook run, panel
  # plays first) - see ansible/roles/komodo/tasks/main.yml.
  ansible.builtin.copy:
    content: "{{ hostvars[groups['komodo'][0]]['komodo_core_public_key'] }}"
    dest: /srv/docker/komodo-agent/data/keys/core.pub
    owner: docker
    group: docker
    mode: "0644"

- name: Start Periphery
  ansible.builtin.command: sudo -u docker -H docker compose -p komodo-agent up -d
  args:
    chdir: /srv/docker/komodo-agent
  changed_when: true
