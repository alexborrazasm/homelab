services:
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    user: "900:900"
    # HOME - uid 900 has no /etc/passwd entry in this image, so without
    # this docker/buildx defaults HOME to "/" and fails trying to create
    # /.docker (permission denied) on any stack that needs a build.
    # /etc/komodo is the one bind mount below we know for sure is
    # docker:docker-owned on the host (Ansible creates it explicitly).
    environment:
      - HOME=/etc/komodo
    # No port published - Periphery only needs an outbound connection to
    # Core (PERIPHERY_CORE_ADDRESS below), never an inbound one.
    env_file: ./.env
    volumes:
      - ./data/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /srv/docker/komodo:/etc/komodo
