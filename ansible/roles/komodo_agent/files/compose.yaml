services:
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: unless-stopped
    user: "900:900"
    # HOME - uid 900 has no /etc/passwd entry in this image, so without
    # this docker/buildx defaults HOME to "/" and fails trying to create
    # /.docker (permission denied) on any stack that needs a build.
    # /srv/docker/komodo is the one bind mount below we know for sure is
    # docker:docker-owned on the host (Ansible creates it explicitly).
    environment:
      - HOME=/srv/docker/komodo
    # No port published - Periphery only needs an outbound connection to
    # Core (PERIPHERY_CORE_ADDRESS below), never an inbound one.
    env_file: ./.env
    volumes:
      - /srv/docker/data/komodo-agent/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Identity bind mount (same path inside and outside) - Periphery
      # uses the host's docker.sock to run `docker compose`, so any
      # relative volume path it resolves (e.g. "./caddyconf") gets built
      # into an absolute path from ITS OWN filesystem view and handed to
      # the host daemon as-is. If the container path didn't match the
      # host path, the daemon would look for that absolute path on the
      # real host - where it doesn't exist - instead of finding the repo
      # Periphery actually cloned. See PERIPHERY_ROOT_DIRECTORY in .env.
      - /srv/docker/komodo:/srv/docker/komodo
      # Same reasoning, for Stacks whose data lives outside the repo
      # clone (e.g. jellyfin's Pre Deploy does mkdir/chown under
      # /srv/docker/data) - without this identity mount, that Pre Deploy
      # command would create the directory inside Periphery's own
      # container instead of on the real host.
      - /srv/docker/data:/srv/docker/data
