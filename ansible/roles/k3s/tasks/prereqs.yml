---
# kubelet hard-fails at startup if it detects active swap. terraform/locals.tf
# already sets swap_mb=0 for these nodes (vm_provision skips creating it),
# but this role shouldn't depend on that upstream cooperation - it asserts
# its own requirement directly.
- name: Check for active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: _swap_check
  changed_when: false
  check_mode: false

- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: _swap_check.stdout | trim != ""

- name: Remove any swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

# k3s's own docs recommend disabling firewalld on RHEL-family nodes
# outright: firewalld (an nftables wrapper) doesn't know about the
# iptables chains flannel creates for the CNI, and a `firewall-cmd
# --reload` wipes them out from under it - confirmed live here (flannel's
# FLANNEL-POSTRTG/FLANNEL-FWD chains vanished, pods stuck with
# "no such file or directory" on /run/flannel/subnet.env). These nodes are
# already isolated at the VLAN/router level, so there's no gap left by
# turning this off - see docs.k3s.io/installation/requirements.
- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active firewalld
  register: _firewalld_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: _firewalld_active.stdout == "active"
  register: _firewalld_disabled

- name: Restart k3s so flannel rebuilds its iptables chains cleanly
  # No-op on a fresh node (service doesn't exist yet - install starts it
  # clean regardless), only matters when firewalld had already broken an
  # existing install's flannel chains.
  ansible.builtin.systemd:
    name: "{{ 'k3s' if k3s_node_role == 'server' else 'k3s-agent' }}"
    state: restarted
  when: _firewalld_disabled is changed
  failed_when: false

# The actual root cause, found after the above wasn't enough on its own:
# kernel-modules-extra (xt_conntrack, xt_comment, nft_compat - what
# iptables-nft needs to write kube-proxy/flannel's rules) isn't installed
# on the AlmaLinux cloud image at all. Not a firewalld problem - confirmed
# by `modprobe xt_conntrack` failing with "not found" even with firewalld
# fully stopped.
- name: Check whether the required netfilter kernel modules are present
  ansible.builtin.command: modprobe xt_conntrack
  register: _xt_conntrack_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install kernel-modules-extra for the running kernel
  ansible.builtin.dnf:
    name: "kernel-modules-extra-{{ ansible_facts['kernel'] }}"
    state: present
  when: _xt_conntrack_check.rc != 0
  register: _kmod_extra_installed

- name: Load the netfilter xtables modules now (don't wait for next reboot)
  # ansible.builtin.command, not community.general.modprobe - no extra
  # collection needed for a one-shot `modprobe`.
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - xt_conntrack
    - xt_comment
    - nft_compat
  when: _kmod_extra_installed is changed
  changed_when: true

- name: Load these modules on every future boot too
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s-netfilter.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      xt_conntrack
      xt_comment
      nft_compat
