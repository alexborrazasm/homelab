---
# The one Application you ever `kubectl apply` by hand - "app of apps".
# It watches kubernetes/apps/ in this same repo; every Application file
# added there (or removed) gets created/deleted automatically from then
# on, no further manual apply needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexborrazasm/homelab.git
    targetRevision: main
    path: kubernetes/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
