---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  annotations:
    # wave 2 - after cluster-issuers.yaml (wave 1), whose ClusterIssuer this
    # Ingress's cert-manager annotation depends on existing already.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/alexborrazasm/homelab.git
    targetRevision: main
    path: kubernetes/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
