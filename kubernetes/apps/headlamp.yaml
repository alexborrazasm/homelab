---
# cluster-admin (the chart's own default) - full control, only safe because
# there's no Ingress here, port-forward only:
#   ./kubectl.sh -n headlamp port-forward svc/headlamp 4466:80
# Drop back to clusterRoleBinding.clusterRoleName: view before ever putting
# this behind an Ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.44.0
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
