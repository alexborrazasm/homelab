---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexborrazasm/homelab.git
    targetRevision: main
    path: kubernetes/ddns
  destination:
    server: https://kubernetes.default.svc
    namespace: ddns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
