---
# Only updates *.alexborrazasm.dev - the apex record points at GitHub
# Pages, not this homelab, so it's deliberately left out of DOMAINS.
#
# PROXIED=true - traffic goes visitor -> Cloudflare -> here, hiding the
# home IP. Requires Cloudflare's SSL/TLS mode set to "Full (strict)" (zone
# setting, not something Terraform/Ansible touches) so Cloudflare
# validates the real cert-manager/Let's Encrypt cert Traefik presents,
# instead of "Flexible" (plaintext to origin) or "Full" (accepts anything).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.0
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token-secret
                  key: api-token
            - name: DOMAINS
              value: "*.alexborrazasm.dev"
            - name: PROXIED
              value: "true"
            - name: IP6_PROVIDER
              value: "none"
          # No runAsUser/runAsNonRoot - the image already defaults to
          # USER 1000:1000. Only setting what the image itself can't
          # declare on its own.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
