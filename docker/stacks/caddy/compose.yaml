services:
  caddy:
    container_name: caddy
    build:
      dockerfile: Dockerfile
    user: "900:900"
    cap_drop: [all]
    cap_add: [net_bind_service] # needed to bind 80/443 as a non-root user
    ports:
      - "80:80"
      - "443:443"
    env_file: ./.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Outside the repo clone on purpose (not ./data, ./config) - so a
      # git clean on the Periphery-managed clone can't ever touch this
      # (TLS certs, ACME account state). Created + chowned by the Stack's
      # Pre Deploy command in Komodo's UI (mkdir -p
      # /srv/docker/data/caddy/{data,config} && chown -R 900:900
      # /srv/docker/data/caddy), not tracked in git.
      - /srv/docker/data/caddy/data:/data
      - /srv/docker/data/caddy/config:/config
    restart: unless-stopped
