services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    user: "900:900"
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    ports:
      - "8096:8096"
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Europe/Madrid
    volumes:
      # Outside the repo clone on purpose (not ./config, ./cache) - so a
      # git clean on the Periphery-managed clone can't ever touch this
      # data. Created + chowned by the Stack's Pre Deploy command in
      # Komodo's UI (mkdir -p /srv/docker/data/jellyfin/{config,cache} &&
      # chown -R 900:900 /srv/docker/data/jellyfin), not tracked in git.
      - /srv/docker/data/jellyfin/config:/config
      - /srv/docker/data/jellyfin/cache:/cache
      - /mnt/jellyfin:/media
    restart: unless-stopped
